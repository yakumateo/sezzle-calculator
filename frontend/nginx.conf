# nginx is the single entry point of the stack: it serves the React build and
# acts as a reverse proxy for the Go backend, so the browser sees one origin
# and no CORS configuration is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls and the Swagger UI page go to the backend. "backend" is the
    # service name in docker-compose; Docker's internal DNS resolves it.
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /docs {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
